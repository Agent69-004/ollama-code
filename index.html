<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Tracker</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Habit Tracker</h1>
      <button id="add-habit-btn">Add Habit</button>
    </header>
    <main>
      <section class="habits">
        <h2>Tracked Habits:</h2>
        <ul id="habit-list">
          <!-- Habit list will be rendered here -->
        </ul>
      </section>
      <section class="stats">
        <h2>Stats:</h2>
        <ul>
          <li>Streak: <span id="streak">0</span></li>
          <li>Total Habits: <span id="total-habits">0</span></li>
          <li>Completed Habits: <span id="completed-habits">0</span></li>
        </ul>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
