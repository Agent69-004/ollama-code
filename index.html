<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEORBX Booster 2026</title>
  <meta name="description" content="A polished reward-flow demo inspired by the MEORBX Booster Roblox-style page.">
  <style>
    :root {
      --purple: #9333ea;
      --purple-dark: #7623c5;
      --emerald: #10b981;
      --ink: #232527;
      --muted: #6b7280;
      --line: #e5e7eb;
      --surface: #ffffff;
      --page: #f3f4f6;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 15% 8%, rgba(147, 51, 234, .12), transparent 26rem),
        radial-gradient(circle at 85% 15%, rgba(16, 185, 129, .10), transparent 24rem),
        var(--page);
      color: var(--ink);
      font-family: Montserrat, Arial, Helvetica, sans-serif;
    }

    body.landing-active {
      overflow: hidden;
      background: radial-gradient(circle at center, #001c44 0%, #000b1a 100%);
    }

    button, input { font: inherit; }
    button { cursor: pointer; border: 0; }
    .hidden { display: none !important; }

    #codex-browser-sidebar-comments-root {
      display: none !important;
      pointer-events: none !important;
    }

    .landing-screen {
      position: fixed;
      inset: 0;
      z-index: 2147483500;
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
      background: radial-gradient(circle at center, #001c44 0%, #000b1a 100%);
      font-family: Nunito, Montserrat, Arial, sans-serif;
    }

    .landing-screen.is-hidden {
      display: none;
    }

    #stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .landing-card {
      position: relative;
      z-index: 1;
      width: min(420px, 95vw);
      padding: 48px 56px 40px;
      border: 1px solid rgba(255, 255, 255, .07);
      border-radius: 20px;
      background: #161b27;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0, 0, 0, .5);
      animation: landingCardIn .7s cubic-bezier(.22, 1, .36, 1) both;
    }

    .landing-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 88px;
      height: 88px;
      margin: 0 auto 20px;
      border: 4px solid #fff;
      border-radius: 50%;
      background: #2d56ff;
      color: #fff;
      font-size: 48px;
      font-weight: 900;
      font-family: Impact, fantasy;
      box-shadow: 0 8px 32px rgba(0, 0, 0, .35);
      animation: landingLogoPulse 3s ease-in-out infinite;
    }
