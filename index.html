    }

      margin: 5px 0;

  </style>
</head>
<body>
  <div class="container">
    <h1>Habit Tracker</h1>
    
    <form id="habitForm">
      <input type="text" id="habitName" placeholder="Enter habit name" required>
      <select id="frequency">
        <option value="daily">Daily</option>
        <option value="weekly">Weekly</option>
        <option value="monthly">Monthly</option>
      </select>
      <button type="submit">Add Habit</button>
    </form>

    <ul class="habit-list" id="habitList"></ul>

    <div class="stats" id="stats">
      <h2>Statistics</h2>
      <p><strong>Total Habits:</strong> <span id="totalHabits">0</span></p>
      <p><strong>Completed:</strong> <span id="completedHabits">0</span> / <span id="totalHabitsSpan">0</span></p>
    </div>
  </div>

  <script>
    const habitForm = document.getElementById('habitForm');
    const habitList = document.getElementById('habitList');
    const stats = document.getElementById('stats');
    const totalHabitsSpan = document.getElementById('totalHabitsSpan');
    const completedHabitsSpan = document.getElementById('completedHabits');
    const totalHabitsSpanStat = document.getElementById('totalHabits');

    let habits = JSON.parse(localStorage.getItem('habits')) || [];

    function saveHabits() {
      localStorage.setItem('habits', JSON.stringify(habits));
    }

    function renderHabits() {
      habitList.innerHTML = '';
      let completedCount = 0;
      
      habits.forEach((habit, index) => {
        const li = document.createElement('li');
        li.className = 'habit-item';
        
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = habit.completed;
        checkbox.addEventListener('change', () => {
          habit.completed = !habit.completed;
          saveHabits();
          renderHabits();
        });
        
        const nameSpan = document.createElement('span');
        nameSpan.textContent = habit.name;
        if (habit.completed) {
          nameSpan.classList.add('completed');
        }
        
        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = 'Delete';
        deleteBtn.addEventListener('click', () => {
          habits.splice(index, 1);
          saveHabits();
          renderHabits();
        });
        
        li.appendChild(checkbox);
        li.appendChild(nameSpan);
        li.appendChild(deleteBtn);
        habitList.appendChild(li);
      });
      
      // Update statistics
      totalHabitsSpan.textContent = habits.length;
      totalHabitsSpanStat.textContent = habits.length;
      completedHabitsSpan.textContent = habits.filter(h => h.completed).length;
    }

    habitForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('habitName').value.trim();
      const frequency = document.getElementById('frequency').value;
      
      if (name !== '') {
        habits.push({ name, frequency, completed: false });
        saveHabits();
        document.getElementById('habitName').value = '';
        renderHabits();
      }
    });

    // Initial render
    renderHabits();
  </script>
</body>
</html>
