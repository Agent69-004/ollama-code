    :root {

      --shadow: 0 24px 70px rgba(15, 23, 42, .18);
      --radius: 18px;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, Montserrat, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    }

    body.landing-active {
      overflow: hidden;
      background: #030712;
    }

    button, input { font: inherit; }
    button {
      border: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .hidden { display: none !important; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .landing-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      color: #fff;
      background:
        linear-gradient(135deg, rgba(5, 8, 22, .72), rgba(32, 13, 74, .56)),
        radial-gradient(circle at 20% 18%, rgba(34, 197, 94, .34), transparent 20rem),
        radial-gradient(circle at 78% 15%, rgba(6, 182, 212, .35), transparent 24rem),
        linear-gradient(135deg, #030712 0%, #111827 46%, #2e1065 100%);
    }

    .landing-screen.is-hidden {
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s ease;
    }

    #stars {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
