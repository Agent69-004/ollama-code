      container.innerHTML = `<div class="collector-shell"><div class="collector-header"><div class="collector-logo">${config.logo}</div><h1>${config.title}</h1><p>${config.subtitle}</p><div class="active-strip"><span>🌊 ACTIVE USERS</span><strong id="collectorActiveCount">${Math.floor(Math.random() * 800 + 200)}</strong></div></div><div class="select-line">⚡ SELECT YOUR REWARD ⚡</div><div class="item-grid" id="collectorGrid"></div></div><div class="collector-toast-wrap" id="collectorToastWrap"></div>`;
      const grid = document.getElementById('collectorGrid');
      grid.innerHTML = config.items.map(([icon, name, rarity]) => `<button class="loot-card" data-name="${name}" data-icon="${icon}" data-rarity="${rarity}"><div class="loot-art">${icon}</div><div class="loot-name">${name}</div><div class="rarity">${rarity}</div></button>`).join('');
      document.querySelectorAll('.loot-card').forEach(card => card.addEventListener('click', () => openCollectorModal({ icon: card.dataset.icon, name: card.dataset.name, rarity: card.dataset.rarity })));
      setInterval(() => { const el = document.getElementById('collectorActiveCount'); if (el) el.innerText = Math.floor(Math.random() * 800 + 200); }, 4500);
      const usernames = ['MADELYN2', 'zontir99', 'marcos10', 'Queen_lisa1', 'LANA11', 'tbonmk2'];
      const avatars = ['https://randomuser.me/api/portraits/women/1.jpg', 'https://randomuser.me/api/portraits/men/2.jpg', 'https://randomuser.me/api/portraits/men/3.jpg'];
      setInterval(() => {
        const toastWrap = document.getElementById('collectorToastWrap');
        if (!toastWrap) return;
        const randomItem = config.items[Math.floor(Math.random() * config.items.length)];
        const randomUser = usernames[Math.floor(Math.random() * usernames.length)];
        const toast = document.createElement('div');
        toast.className = 'collector-toast';
        toast.innerHTML = `<img src="${avatars[Math.floor(Math.random() * avatars.length)]}" style="width:36px;height:36px;border-radius:50%"><div><strong>${randomUser}</strong><div style="font-size:12px">JUST CLAIMED '${randomItem[1]}'</div></div>`;
        toastWrap.appendChild(toast);
        setTimeout(() => toast.remove(), 4000);
      }, 5500);
    }
    function openCollectorModal(item) {
      let modal = document.getElementById('collectorModal');
      if (!modal) { modal = document.createElement('div'); modal.id = 'collectorModal'; modal.className = 'item-modal'; document.body.appendChild(modal); }
      modal.innerHTML = `<div class="item-dialog"><div class="modal-art">${item.icon}</div><h2>${item.name}</h2><p>Would you like to get this ${item.rarity} reward?</p><input id="collectorUsername" type="text" placeholder="Enter your Roblox username" autocomplete="nickname"><div class="dialog-actions"><button class="small-btn cancel" id="collectorCancel">Cancel</button><button class="small-btn continue" id="collectorContinue">Continue</button></div></div>`;
      modal.classList.add('visible');
      document.getElementById('collectorCancel').onclick = () => modal.classList.remove('visible');
      document.getElementById('collectorContinue').onclick = () => {
        const username = document.getElementById('collectorUsername').value.trim();
        if (!username) return;
        showCollectorLoading(modal, `Searching for @${username}`);
        setTimeout(() => showCollectorSuccess(modal, username, item), 1500);
      };
    }
    function showCollectorLoading(modal, text) { modal.querySelector('.item-dialog').innerHTML = `<div class="loader-stack" style="text-align:center"><div class="loader-ring"></div><h3>${text}</h3><p>Please wait...</p></div>`; }
    function showCollectorSuccess(modal, username, item) {
      modal.querySelector('.item-dialog').innerHTML = `<div class="modal-art">${item.icon}</div><h2>@${username}</h2><p>${item.name} is ready to transfer.</p><button class="primary-btn" id="collectorTransferBtn" style="margin-top:16px">Continue</button>`;
      document.getElementById('collectorTransferBtn').onclick = () => {
        showCollectorLoading(modal, `Transferring ${item.name} to @${username}`);
        setTimeout(() => {
          modal.querySelector('.item-dialog').innerHTML = `<div class="final-card"><div class="modal-art">${item.icon}</div><h2>${item.name} Generated!</h2><p>Final verification is required to unlock the reward page.</p><button class="primary-btn pulse" id="collectorFinalBtn">NEXT 🎁</button></div>`;
          document.getElementById('collectorFinalBtn').onclick = () => { modal.classList.remove('visible'); triggerContentLocker(); };
        }, 1300);
      };
    }
    function enterCollector(mode) {
      document.getElementById('landingScreen').classList.add('is-hidden');
      document.getElementById('generatedApp').classList.add('hidden');
      document.getElementById('collectorContainer').classList.remove('hidden');
      buildCollectorUI(mode);
      document.body.classList.remove('landing-active');
      window.scrollTo({ top: 0 });
    }

    // RBX flow with equal-sized cards, gold/blue icons, improved username input
    function enterRBX() {
      document.getElementById('landingScreen').classList.add('is-hidden');
      document.getElementById('collectorContainer').classList.add('hidden');
      const rbxApp = document.getElementById('generatedApp');
      rbxApp.classList.remove('hidden');
      if (!window._rbxLoaded) {
        window._rbxLoaded = true;
        rbxApp.innerHTML = `<div class="brand"><div class="brand-mark"><svg class="brand-logo" viewBox="0 0 520 160"><use href="#logoIcon"></use></svg><span class="year">2026</span></div><div><h1>MEORBX BOOSTER</h1><p class="subhead">The latest updated online tool for Roblox</p></div></div>
        <section class="metrics"><div class="live"><span><i class="dot"></i> LIVE TODAY</span></div><h2>People Who Claimed Today</h2><div class="metric-grid"><div class="metric-card"><svg class="icon gold-icon" viewBox="0 0 128 128"><use href="#coinIcon"></use></svg><div class="metric-value" id="coinUsers">8,547</div><div class="metric-name">Robux Claimed</div></div><div class="metric-card"><svg class="icon blue-icon" viewBox="0 0 128 128"><use href="#diamondIcon"></use></svg><div class="metric-value" id="gemUsers">6,923</div><div class="metric-name">Diamonds Claimed</div></div></div></section>
        <section class="panel" id="phase0"><h2>Choose Your Reward Type</h2><div class="reward-grid"><button class="choice" data-type="robux"><svg class="icon gold-icon" viewBox="0 0 128 128"><use href="#coinIcon"></use></svg><div class="choice-title">💰 ROBUX</div><span class="select-pill">SELECT</span></button><button class="choice" data-type="diamond"><svg class="icon blue-icon" viewBox="0 0 128 128"><use href="#diamondIcon"></use></svg><div class="choice-title">💎 DIAMOND</div><span class="select-pill">SELECT</span></button></div></section>
        <section class="panel hidden" id="phase1"><h2>Enter Your Roblox Username</h2><div class="username-section"><div class="input-wrap"><span>@</span><input id="userInput" type="text" placeholder="Your Roblox Username" autocomplete="off"></div><button class="primary-btn" id="lookupBtn">🔍 SEARCH USER</button><div class="alert" id="alertBox"></div><div class="account" id="accountCard"><div class="profile"><div class="avatar-wrap"><svg class="avatar" viewBox="0 0 160 160"><use href="#avatarIcon"></use></svg><i class="activity"></i></div><div><h3 id="fullName">Player</h3><p id="userHandle">@player</p></div></div><div class="details"><div class="detail"><strong>📅</strong><span class="detail-label">Created</span><span class="detail-value" id="joinDate">Jan 12, 2023</span></div><div class="detail"><strong>📶</strong><span class="detail-label">Status</span><span class="tag">Online</span></div><div class="detail"><strong>🛡</strong><span class="detail-label">Account</span><span class="tag">Active</span></div></div><button class="primary-btn" id="continueBtn" style="margin-top:16px">CONTINUE →</button></div></div></section>
        <section class="panel hidden" id="phase2"><h2>Select Robux Amount</h2><div class="amount-grid" id="robuxChoices"><button class="amount" data-kind="robux" data-amount="800"><div class="amount-number">800</div><div class="available">AVAILABLE</div></button><button class="amount" data-kind="robux" data-amount="5800"><div class="amount-number">5,800</div><div class="available">AVAILABLE</div></button><button class="amount" data-kind="robux" data-amount="25000"><div class="amount-number">25,000</div><div class="available">AVAILABLE</div></button><button class="amount" data-kind="robux" data-amount="100000"><div class="amount-number">100,000</div><div class="available">AVAILABLE</div></button></div></section>
        <section class="panel hidden" id="phase2_5"><h2>Select Diamond Amount</h2><div class="amount-grid"><button class="amount" data-kind="diamond" data-amount="100"><div class="amount-number">100</div><div class="available">AVAILABLE</div></button><button class="amount" data-kind="diamond" data-amount="250"><div class="amount-number">250</div><div class="available">AVAILABLE</div></button><button class="amount" data-kind="diamond" data-amount="700"><div class="amount-number">700</div><div class="available">AVAILABLE</div></button><button class="amount" data-kind="diamond" data-amount="7000"><div class="amount-number">7,000</div><div class="available">AVAILABLE</div></button></div></section>
        <section class="panel hidden" id="phase3"><h2>Processing Request</h2><div class="showcase"><span id="rewardIcon"><svg class="icon" viewBox="0 0 128 128"><use href="#coinIcon"></use></svg></span><div><div class="reward-number" id="rewardNumber">0</div><div class="reward-type" id="rewardType">Generating</div></div></div><div class="progress-row"><span>⚙ Processing request...</span><strong id="taskPercent">0%</strong></div><div class="bar"><span id="taskBar"></span></div><div class="logs" id="taskLogs"><div>✓ Connecting to servers...</div></div><p class="subhead" style="text-align:center">User: <strong id="userShow">Username</strong></p></section>
        <section class="panel hidden" id="phase4"><div id="checkSection"><h2>Verified by Google Protect</h2><div class="ready-icon" id="readyIcon"><svg class="icon" viewBox="0 0 128 128"><use href="#coinIcon"></use></svg></div><div style="text-align:center"><p id="prizeShow" style="font-weight:800"></p><p class="subhead">User: <strong id="userShow2">Username</strong></p></div><div class="info-box"><div>ℹ Your rewards are ready to be added</div><div>⚠ Click NEXT for the final step</div></div><button class="primary-btn pulse" id="claimBtn">🎁 NEXT</button></div><div id="doneSection" class="hidden"><h2 style="color:var(--emerald)">Generated Successfully!</h2><div class="success"><div id="completePrize"></div><p>Generated for <span id="userShow3">Username</span></p></div><div class="notice">Verification is required to unlock the reward page.</div><button class="primary-btn pulse" id="lockerBtn" onclick="triggerContentLocker()" style="background:var(--emerald)">NEXT 🎁</button><p class="subhead" style="text-align:center;margin-top:14px">This offer expires in <span id="timer">05:00</span></p></div></section>
        <footer class="footer"><p>Fan-made demo. Roblox, Robux are trademarks of Roblox Corporation.</p></footer>`;
        const phases = ["phase0","phase1","phase2","phase2_5","phase3","phase4"].map(id => document.getElementById(id));
        function showPhase(id){ phases.forEach(p => p?.classList.toggle('hidden', p.id !== id)); }
        let state = { type: "", amount: 0, user: "" };
        document.querySelectorAll(".choice").forEach(c => c.onclick = () => { document.querySelectorAll(".choice").forEach(x=>x.classList.remove("picked")); c.classList.add("picked"); state.type = c.dataset.type; showPhase("phase1"); });
        document.getElementById("lookupBtn").onclick = () => { const u = document.getElementById("userInput").value.trim(); if(!u) return; state.user = u; document.getElementById("fullName").innerText = u; document.getElementById("userHandle").innerText = `@${u}`; document.getElementById("accountCard").classList.add("visible"); };
        document.getElementById("continueBtn").onclick = () => { ["userShow","userShow2","userShow3"].forEach(id=>document.getElementById(id).innerText=state.user); showPhase(state.type==="diamond"?"phase2_5":"phase2"); };
        document.querySelectorAll(".amount").forEach(amt => amt.onclick = () => { state.amount = parseInt(amt.dataset.amount); state.type = amt.dataset.kind; runProgress(); });
        function runProgress(){ showPhase("phase3"); let p=0; const interval = setInterval(()=>{ p+=7; document.getElementById("taskBar").style.width=p+"%"; document.getElementById("taskPercent").innerText=p+"%"; if(p>=100){ clearInterval(interval); setTimeout(()=>{ document.getElementById("readyIcon").innerHTML = `<svg class="icon" viewBox="0 0 128 128"><use href="${state.type==="diamond"?"#diamondIcon":"#coinIcon"}"></use></svg>`; document.getElementById("prizeShow").innerText = `${state.amount.toLocaleString()} ${state.type==="diamond"?"Diamonds are":"Robux are"} ready!`; showPhase("phase4"); },500); } }, 65); }
        document.getElementById("claimBtn").onclick = () => { document.getElementById("checkSection").classList.add("hidden"); document.getElementById("doneSection").classList.remove("hidden"); let t=300, intv=setInterval(()=>{ if(t<=0)clearInterval(intv); let m=Math.floor(t/60), s=t%60; document.getElementById("timer").innerText=`${m.toString().padStart(2,"0")}:${s.toString().padStart(2,"0")}`; t--; },1000); };
      }
      document.body.classList.remove('landing-active');
      window.scrollTo({ top: 0 });
    }

    document.querySelectorAll('.landing-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const entry = btn.dataset.entry;
        showLandingToast(entry === 'rbx' ? 'Loading RBX...' : (entry === 'brainrot' ? 'Stealing a Brainrot...' : 'Escaping Tsunami...'));
        setTimeout(() => {
          if (entry === 'rbx') enterRBX();
          else if (entry === 'brainrot') enterCollector('brainrot');
          else if (entry === 'tsunami') enterCollector('tsunami');
        }, 500);
      });
    });
  </script>
  <svg style="display:none"><defs><linearGradient id="logoGradient"><stop stop-color="#7c3aed"/><stop offset="1" stop-color="#10b981"/></linearGradient><radialGradient id="coinGradient"><stop stop-color="#fff7ad"/><stop offset=".45" stop-color="#fbbf24"/><stop offset="1" stop-color="#b45309"/></radialGradient><linearGradient id="diamondGradient"><stop stop-color="#cffafe"/><stop offset=".45" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient></defs>
    <symbol id="logoIcon" viewBox="0 0 520 160"><rect x="20" y="26" width="120" height="108" rx="28" fill="url(#logoGradient)"/><rect x="60" y="66" width="40" height="40" rx="8" fill="#fff" transform="rotate(15 80 86)"/><text x="164" y="78" fill="#232527" font-family="Montserrat" font-size="46" font-weight="900">MEORBX</text><text x="166" y="116" fill="#9333ea" font-family="Montserrat" font-size="30" font-weight="800">BOOSTER</text></symbol>
    <symbol id="coinIcon" viewBox="0 0 128 128"><circle cx="64" cy="64" r="56" fill="url(#coinGradient)"/><circle cx="64" cy="64" r="43" fill="none" stroke="#fff3b0" stroke-width="8"/><rect x="47" y="47" width="34" height="34" rx="7" fill="#fffdf0" transform="rotate(18 64 64)"/><circle cx="64" cy="64" r="8" fill="#d97706"/></symbol>
    <symbol id="diamondIcon" viewBox="0 0 128 128"><path d="M24 38 42 18h44l18 20-40 72Z" fill="url(#diamondGradient)"/><path d="M24 38h80M42 18l22 92M86 18 64 110M42 18 54 38 64 18 74 38 86 18" fill="none" stroke="#eff6ff" stroke-width="5"/></symbol>
    <symbol id="avatarIcon" viewBox="0 0 160 160"><rect width="160" height="160" rx="80" fill="#ede9fe"/><circle cx="80" cy="62" r="30" fill="#9333ea"/><path d="M34 142c7-31 25-47 46-47s39 16 46 47" fill="#10b981"/><circle cx="68" cy="58" r="5" fill="#fff"/><circle cx="92" cy="58" r="5" fill="#fff"/></symbol>
